name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask pytest pyflakes

      - name: Python syntax check
        run: |
          find . -name "*.py" -not -path "./.venv/*" -not -path "./venv/*" \
            -exec python3 -m py_compile {} +

      - name: Lint with pyflakes
        run: |
          find . -name "*.py" -not -path "./.venv/*" -not -path "./venv/*" \
            -exec pyflakes {} +

      - name: Run test suite
        run: |
          pytest -v
